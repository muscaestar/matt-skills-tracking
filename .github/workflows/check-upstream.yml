name: Check Upstream Updates

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/mattpocock/skills.git
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          NEW_COMMITS=$(git log HEAD..upstream/main --oneline)
          if [ -z "$NEW_COMMITS" ]; then
            echo "no_new_commits=true" >> "$GITHUB_OUTPUT"
            echo "No new commits from upstream."
          else
            COUNT=$(git log HEAD..upstream/main --oneline | wc -l | tr -d ' ')
            LATEST_SHA=$(git rev-parse --short upstream/main)
            echo "no_new_commits=false" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if no new commits
        if: steps.check.outputs.no_new_commits == 'true'
        run: echo "No new upstream commits. Exiting." && exit 0

      - name: Collect commit details and changed files
        if: steps.check.outputs.no_new_commits == 'false'
        id: collect
        env:
          COUNT: ${{ steps.check.outputs.count }}
          LATEST_SHA: ${{ steps.check.outputs.latest_sha }}
        run: |
          # Collect commits, classifying each as merge / format / substantive.
          # Format-only = every touched file is identical after stripping all
          # whitespace and punctuation from both sides of the diff (catches
          # repo-wide cleanups like em-dash removal). New/deleted files always
          # count as substantive.
          COMMITS_LIST=""
          SUB_COUNT=0
          FMT_COUNT=0
          MERGE_COUNT=0
          SUB_FILES_FILE=$(mktemp)
          FMT_FILES_FILE=$(mktemp)
          : > "$SUB_FILES_FILE"
          : > "$FMT_FILES_FILE"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            SHA=$(echo "$line" | awk '{print $1}')
            MSG=$(git log -1 --format="%s" "$SHA" 2>/dev/null || echo "$line")
            AUTHOR=$(git log -1 --format="%an" "$SHA" 2>/dev/null || echo "unknown")
            DATE=$(git log -1 --format="%as" "$SHA" 2>/dev/null || echo "unknown")
            FULL_SHA=$(git rev-parse "$SHA" 2>/dev/null || echo "$SHA")

            PARENTS=$(git cat-file -p "$SHA" 2>/dev/null | grep -c '^parent ' || echo 0)
            CTYPE=""
            if [ "$PARENTS" -gt 1 ]; then
              MERGE_COUNT=$((MERGE_COUNT + 1))
            else
              FORMAT_ONLY=1
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                if git cat-file -e "${SHA}^:${f}" 2>/dev/null; then
                  OLD=$(git show "${SHA}^:${f}" 2>/dev/null | tr -d '[:space:][:punct:]')
                else
                  OLD=""
                fi
                if git cat-file -e "${SHA}:${f}" 2>/dev/null; then
                  NEW=$(git show "${SHA}:${f}" 2>/dev/null | tr -d '[:space:][:punct:]')
                else
                  NEW=""
                fi
                if [ "$OLD" != "$NEW" ]; then
                  FORMAT_ONLY=0
                  break
                fi
              done < <(git diff-tree --no-commit-id --name-only -r "$SHA" 2>/dev/null)
              if [ "$FORMAT_ONLY" -eq 1 ]; then
                CTYPE="format"
                FMT_COUNT=$((FMT_COUNT + 1))
              else
                CTYPE="substantive"
                SUB_COUNT=$((SUB_COUNT + 1))
              fi
              if [ "$CTYPE" = "format" ]; then
                git diff-tree --no-commit-id --name-only -r "$SHA" >> "$FMT_FILES_FILE"
              else
                git diff-tree --no-commit-id --name-only -r "$SHA" >> "$SUB_FILES_FILE"
              fi
            fi

            TAG=""
            case "$CTYPE" in
              format) TAG=" 🔧格式" ;;
              substantive) TAG=" ✍️实质" ;;
            esac
            COMMITS_LIST="${COMMITS_LIST}- [\`${SHA}\`](https://github.com/mattpocock/skills/commit/${FULL_SHA})${TAG} ${MSG} (@${AUTHOR}, ${DATE})\n"
          done < <(git log HEAD..upstream/main --oneline)

          # A file touched by both a format-only and a substantive commit needs
          # translation attention, so subtract substantive files from the
          # format list.
          SUB_FILES=$(sort -u "$SUB_FILES_FILE")
          FMT_FILES=$(comm -23 <(sort -u "$FMT_FILES_FILE") <(echo "$SUB_FILES") || true)
          rm -f "$SUB_FILES_FILE" "$FMT_FILES_FILE"

          # Split each group into skills/ files and other files
          SUB_SKILLS=$(echo "$SUB_FILES" | grep '^skills/' || true)
          SUB_OTHER=$(echo "$SUB_FILES" | grep -v '^skills/' || true)
          FMT_SKILLS=$(echo "$FMT_FILES" | grep '^skills/' || true)
          FMT_OTHER=$(echo "$FMT_FILES" | grep -v '^skills/' || true)

          # Union of every file changed by any commit (for the full list)
          ALL_FILES=$(printf '%s\n%s\n' "$SUB_FILES" "$FMT_FILES" | grep -v '^$' | sort -u || true)

          echo "sub_count=$SUB_COUNT" >> "$GITHUB_OUTPUT"
          echo "fmt_count=$FMT_COUNT" >> "$GITHUB_OUTPUT"
          echo "merge_count=$MERGE_COUNT" >> "$GITHUB_OUTPUT"

          write_output() {
            local name="$1"
            local value="$2"
            {
              echo "${name}<<EOF_OUT"
              echo "$value"
              echo "EOF_OUT"
            } >> "$GITHUB_OUTPUT"
          }
          write_output "commits_list" "$COMMITS_LIST"
          write_output "sub_skills" "$SUB_SKILLS"
          write_output "sub_other" "$SUB_OTHER"
          write_output "fmt_skills" "$FMT_SKILLS"
          write_output "fmt_other" "$FMT_OTHER"
          write_output "all_files" "$ALL_FILES"

      - name: Ensure upstream-sync label exists
        if: steps.check.outputs.no_new_commits == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "upstream-sync" \
            --description "自动追踪上游更新的 Issue" \
            --color "0075ca" \
            --repo "${{ github.repository }}" \
            2>/dev/null || true

      - name: Check for existing tracking issue
        if: steps.check.outputs.no_new_commits == 'false'
        id: existing_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_SHA: ${{ steps.check.outputs.latest_sha }}
        run: |
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "upstream-sync" \
            --state open \
            --search "[上游同步] 发现新更新 (upstream @ ${LATEST_SHA})" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found existing issue #${EXISTING}, skipping creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tracking issue
        if: >
          steps.check.outputs.no_new_commits == 'false' &&
          steps.existing_issue.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.check.outputs.count }}
          LATEST_SHA: ${{ steps.check.outputs.latest_sha }}
          COMMITS_LIST: ${{ steps.collect.outputs.commits_list }}
          SUB_COUNT: ${{ steps.collect.outputs.sub_count }}
          FMT_COUNT: ${{ steps.collect.outputs.fmt_count }}
          MERGE_COUNT: ${{ steps.collect.outputs.merge_count }}
          SUB_SKILLS: ${{ steps.collect.outputs.sub_skills }}
          SUB_OTHER: ${{ steps.collect.outputs.sub_other }}
          FMT_SKILLS: ${{ steps.collect.outputs.fmt_skills }}
          FMT_OTHER: ${{ steps.collect.outputs.fmt_other }}
          ALL_FILES: ${{ steps.collect.outputs.all_files }}
        run: |
          file_section() {
            # $1 = file list (one per line, may be empty), $2 = empty placeholder text
            if [ -z "$(printf '%s' "$1" | tr -d '[:space:]')" ]; then
              printf '%s' "$2"
            else
              printf '%s\n' "$1" | sed 's/^/- /'
            fi
          }

          SUB_SKILLS_SECTION=$(file_section "$SUB_SKILLS" '（无）')
          SUB_OTHER_SECTION=$(file_section "$SUB_OTHER" '（无）')
          FMT_SKILLS_SECTION=$(file_section "$FMT_SKILLS" '（无）')
          FMT_OTHER_SECTION=$(file_section "$FMT_OTHER" '（无）')
          ALL_FILES_SECTION=$(file_section "$ALL_FILES" '（无）')

          ISSUE_BODY_FILE=$(mktemp /tmp/check-upstream-issue-body-XXXXXX.md)
          REPO="${{ github.repository }}"

          {
            printf '上游仓库 [mattpocock/skills](https://github.com/mattpocock/skills) 的 `main` 分支发现 **%s** 个新 commit（实质性 %s / 格式性 %s / merge %s），当前仓库尚未同步。\n\n' "$COUNT" "$SUB_COUNT" "$FMT_COUNT" "$MERGE_COUNT"
            printf '## 新 commit 列表\n\n'
            printf '%b\n' "$COMMITS_LIST"
            printf '## ✍️ 实质性改动（需要跟翻）\n\n'
            printf '### 涉及的 skill 文件（`skills/` 目录）\n\n'
            printf '%s\n\n' "$SUB_SKILLS_SECTION"
            printf '### 其他文件\n\n'
            printf '%s\n\n' "$SUB_OTHER_SECTION"
            printf '## 🔧 格式/标点改动（通常无需跟翻）\n\n'
            printf '仅空白与标点变化的 commit 触碰过的文件；与上方实质性改动重叠的文件已归入上方。\n\n'
            printf '### `skills/` 目录\n\n'
            printf '%s\n\n' "$FMT_SKILLS_SECTION"
            printf '### 其他文件\n\n'
            printf '%s\n\n' "$FMT_OTHER_SECTION"
            printf '<details>\n<summary>全部改动文件清单（点击展开）</summary>\n\n'
            printf '%s\n\n' "$ALL_FILES_SECTION"
            printf '</details>\n\n'
            printf '## 后续步骤\n\n'
            printf '1. **同步上游改动**：通过 GitHub 的 "Sync fork" 功能或手动 `git fetch upstream && git merge upstream/main` 将上游最新改动合并到本仓库 `main` 分支。\n'
            printf '2. **检查中文翻译**：对照上方「实质性改动」涉及的 skill 文件，检查 `zh-CN/` 目录下对应翻译文件是否需要更新（新增或修改）。「格式/标点改动」一节通常只需快速浏览确认。\n'
            printf '3. **更新翻译状态**：完成翻译更新后，记得同步更新 `zh-CN/README.md` 中的翻译状态清单，填写对应的 commit SHA 与翻译进度。\n\n'
            printf -- '---\n\n'
            printf '*此 Issue 由 [check-upstream workflow](https://github.com/%s/actions/workflows/check-upstream.yml) 自动创建。*\n' "$REPO"
          } > "$ISSUE_BODY_FILE"

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[上游同步] 发现新更新 (upstream @ ${LATEST_SHA})" \
            --label "upstream-sync" \
            --body-file "$ISSUE_BODY_FILE"
